<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytcs - ConsultaRe</title>
    <link rel="icon" href="../assets/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../src/styles/base/layout.css">
    <link rel="stylesheet" href="../../src/styles/base/reset.css">
    <link rel="stylesheet" href="../../src/styles/base/variables.css">
    <link rel="stylesheet" href="../../src/styles/components/button.css">
    <link rel="stylesheet" href="../../src/styles/components/cards.css">
    <link rel="stylesheet" href="../../src/styles/components/header.css">
    <link rel="stylesheet" href="../../src/styles/components/logo.css">
    <link rel="stylesheet" href="../../src/styles/components/modals.css">
    <link rel="stylesheet" href="../../src/styles/components/sidebar.css">
    <link rel="stylesheet" href="../../src/styles/components/toggle-painel.css">
    <link rel="stylesheet" href="../../src/styles/components/utilities.css">
</head>
<body>
    <div class="container" id="mainContainer">
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <img src="../assets/icon.png" class="icon" alt="ConsultaRe">
                </div>
                <div class="logo-text">
                    <span class="logo-text1">Consulta</span>
                    <span class="logo-text2">Re</span>
                </div>
            </div>
            
            <nav>
                <a href="home.html">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
                <a class="active" href="#">
                    <i class="fas fa-chart-bar"></i>
                    <span>Analytcs</span>
                </a>
                <a href="settings.html">
                    <i class="fas fa-cog"></i>
                    <span>Configurações</span>
                </a>
                <a href="about.html">
                    <i class="fas fa-info-circle"></i>
                    <span>Sobre</span>
                </a>
            </nav>
            
            <a href="profile.html">
                <div class="sidebar-profile">
                    <div class="profile-avatar">
                        <span id="sidebarUserInitials"><i class="fas fa-user"></i></span>
                    </div>
                    <div class="profile-info">
                        <div class="profile-name" id="sidebarUserName">Username</div>
                        <div class="profile-role" id="sidebarUserRole">role</div>
                    </div>
                    <button class="profile-menu-btn">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>
                </div>
            </a>
        </aside>

        <main class="content">
            <header>
                <div class="header-left">
                    <h2>Analytcs</h2>
                </div>
            </header>

            <div class="tabs">
                <button class="tab active">Ultimo mês</button>
                <button class="tab">Ultima Semana</button>
                <button class="tab">Em Andamento</button>
            </div>
        </main>
    </div>

    <div class="client-details-sidebar" id="clientDetailsSidebar">
        <div class="client-details-header">
            <h3>Detalhes do Cliente</h3>
            <button class="close-sidebar" id="closeClientSidebar">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="client-details-content" id="clientDetailsContent">
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <script type="module" src="../../../frontend/src/main.js"></script>
</body>
</html>

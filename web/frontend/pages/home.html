<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - ConsultaRe</title>
    <link rel="icon" href="../assets/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style/total_style/variables.css">
    <link rel="stylesheet" href="../style/total_style/reset.css">
    <link rel="stylesheet" href="../style/total_style/layout.css">
    <link rel="stylesheet" href="../style/total_style/sidebar.css">
    <link rel="stylesheet" href="../style/total_style/logo.css">
    <link rel="stylesheet" href="../style/total_style/header.css">
    <link rel="stylesheet" href="../style/total_style/cards.css">
    <link rel="stylesheet" href="../style/total_style/button.css">
    <link rel="stylesheet" href="../style/total_style/profile-painel.css">
    <link rel="stylesheet" href="../style/total_style/modals.css">
    <link rel="stylesheet" href="../style/total_style/utilities.css">
</head>
<body>
    <div class="container" id="mainContainer">
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <img src="../assets/icon.png" class="icon" alt="ConsultaRe">
                </div>
                <div class="logo-text">
                    <span class="logo-text1">Consulta</span>
                    <span class="logo-text2">Re</span>
                </div>
            </div>
            
            <nav>
                <a class="active" href="#">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
                <a class="" href="analytcs.html">
                    <i class="fas fa-chart-bar"></i>
                    <span>Analytcs</span>
                </a>
                <a href="settings.html">
                    <i class="fas fa-cog"></i>
                    <span>Configurações</span>
                </a>
                <a href="about.html">
                    <i class="fas fa-info-circle"></i>
                    <span>Sobre</span>
                </a>
            </nav>
            
            <a href="profile.html">
                <div class="sidebar-profile">
                    <div class="profile-avatar">
                        <span id="sidebarUserInitials"><i class="fas fa-user"></i></span>
                    </div>
                    <div class="profile-info">
                        <div class="profile-name" id="sidebarUserName">Arianne Abreu</div>
                        <div class="profile-role" id="sidebarUserRole">Consultor Financeiro</div>
                    </div>
                    <button class="profile-menu-btn">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>
                </div>
            </a>
        </aside>

        <main class="content">
            <header>
                <div class="header-left">
                    <h2>Clientes</h2>
                </div>
                <button id="addBtn">
                    <i class="fas fa-plus"></i>
                    <span>Add Lead</span>
                </button>
            </header>

            <div class="tabs">
                <button class="tab active">Todos os Leads</button>
                <button class="tab">Novos</button>
                <button class="tab">Em Andamento</button>
                <button class="tab">Concluídos</button>
                <button class="tab">Arquivados</button>
            </div>

            <section class="cards" id="clientsGrid">
            </section>
        </main>
    </div>

    <div class="modal" id="addClientModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Adicionar Novo Cliente</h3>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <form id="clientForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf">
                    </div>
                    <div class="form-group">
                        <label for="cnpj">CNPJ</label>
                        <input type="text" id="cnpj">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="origem_cliente">Origem do Cliente</label>
                        <select id="origem_cliente" required>
                            <option value="">Selecione</option>
                            <option value="Instagram">Instagram</option>
                            <option value="Facebook">Facebook</option>
                            <option value="Indicação">Indicação</option>
                            <option value="Google">Google</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="servico">Serviço</label>
                        <select id="servico" required>
                            <option value="">Selecione</option>
                            <option value="Limpa Nome">Limpa Nome</option>
                            <option value="Rating Comercial">Rating Comercial</option>
                            <option value="Consultoria">Consultoria</option>
                            <option value="Limpa Bacen">Limpa Bacen</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="data_inicio_atendimento">Data de Início do Atendimento</label>
                        <input type="date" id="data_inicio_atendimento" required>
                    </div>
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status">
                            <option value="Novo">Novo</option>
                            <option value="Em Andamento">Em Andamento</option>
                            <option value="Concluído">Concluído</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="objetivo">Objetivo</label>
                    <textarea id="objetivo" required></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="cancel-btn" id="cancelAdd">Cancelar</button>
                    <button type="submit">Adicionar Cliente</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Client Details Sidebar -->
    <div class="client-details-sidebar" id="clientDetailsSidebar">
        <div class="client-details-header">
            <h3>Detalhes do Cliente</h3>
            <div class="header-actions">
                <button class="action-btn edit-client-btn" title="Editar cliente" onclick="enableClientEdit()">
                    <i class="fas fa-edit"></i>
                </button>
                <button class="close-sidebar" id="closeClientSidebar">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <div class="client-details-content" id="clientDetailsContent">
            <!-- O conteúdo será preenchido via JavaScript -->
        </div>
    </div>

    <!-- Overlay para o sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script src="../scripts/script.js"></script>
</body>
</html>
